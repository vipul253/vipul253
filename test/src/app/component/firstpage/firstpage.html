'<button class="btn btn-primary" (click)="showData()">showData</button>

<div class="col-6">

    <ul class="list-group">
        @for (item of userList; track item.id)
        {
        <li class="list-group-item">
            <span class="label label-default">{{item.id}} - {{item.name}} - {{item.email}}</span>
            <button class="btn btn-primary" (click)="populateForm(item)">Modify</button>
            <button class="btn btn-danger" (click)="deleteUser(item.id)">Delete</button>
        </li>
        }
    </ul>

    @if (userList.length>0) {
    <form [formGroup]="modifyForm" (ngSubmit)="modifyData()">
        <label>
            ID:
            <input type="number" formControlName="id" (keypress)="numericOnly($event)" />
        </label>
        <label>
            Name:
            <input type="text" formControlName="name" />
        </label>
        <label>
            Email:
            <input type="email" formControlName="email" />
        </label>
        <label>=></label>
        <button class="btn btn-primary" type="submit">Modify User</button>
    </form>
    }
</div>
